name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels its previous run. Runs on main always finish, since the image
# publishing waits for them
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    # Throwaway database so the Spring context test can boot
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only dummy values; real secrets live in the developer's .env
    env:
      SUPABASE_DB_HOST: localhost
      SUPABASE_DB_PORT: 5432
      SUPABASE_DB_DATABASE: postgres
      SUPABASE_DB_USERNAME: postgres
      SUPABASE_DB_PASSWORD: postgres
      JWT_SECRET: ci-only-dummy-secret-that-is-at-least-32-bytes-long
      CLOUDFLARE_ACCOUNT_ID: ci-dummy
      CLOUDFLARE_ACCESS_KEY_ID: ci-dummy
      CLOUDFLARE_SECRET_ACCESS_KEY: ci-dummy
      R2_BUCKET: ci-dummy
      WORKSHOPS_PUSH_TOPIC: ci-dummy
      MAIL_HOST: localhost
      MAIL_PORT: 587
      MAIL_USERNAME: ci-dummy
      MAIL_PASSWORD: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # Which tests failed and why, without rerunning locally
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      # Line coverage from JaCoCo's CSV (columns 8 and 9: lines missed, lines covered)
      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR > 1 { missed += $8; covered += $9 }
              END { printf "### Line coverage: %.1f%% (%d of %d lines)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
              "$csv" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Builds the Dockerfile on every PR, so a broken image is caught before the merge instead of in
  # the publish workflow. Nothing is pushed; the cache is shared with publish-image.yml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
