name: Publish image

# After Backend CI passes on main, build the Docker image from the commit CI tested and push it
# to GitHub Container Registry. A merge that breaks the tests never produces an image.
# workflow_run only runs the version of this file on main, so it can't be tried on a PR.
on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [main]

# Two quick merges publish one after the other, in order
concurrency:
  group: publish-image

env:
  IMAGE: ghcr.io/yorkchk/medrational   # GHCR names must be lowercase

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    # GITHUB_TOKEN can push to this repo's packages; no extra secret needed
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<commit> is immutable: uat runs it and prod is promoted with the same tag.
      # latest always points to the newest build from main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      # The gha cache keeps the Maven dependencies and LibreOffice layers between runs
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "### Published \`${IMAGE}:sha-${SHA}\`"
            echo
            echo "Also tagged \`latest\`."
            echo
            echo '```'
            echo "docker pull ${IMAGE}:sha-${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
