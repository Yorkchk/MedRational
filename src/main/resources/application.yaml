cloudflare:
  r2:
    endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
    access-key: ${CLOUDFLARE_ACCESS_KEY_ID}
    secret-key: ${CLOUDFLARE_SECRET_ACCESS_KEY}
    bucket-name: "categories"

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8080
  address: 0.0.0.0   # Binds to all network interfaces so local devices can reach it

preview:
  office-home: ${LIBREOFFICE_HOME:}   # LibreOffice install dir; empty = auto-detect
  port-numbers: 2002
  task-execution-timeout-ms: 60000

downloads:
  recent:
    default-limit: 10   # files returned by /users/{id}/recent-downloads when no ?limit is given
    max-limit: 50       # upper bound for ?limit
