cloudflare:
  r2:
    endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
    access-key: ${CLOUDFLARE_ACCESS_KEY_ID}
    secret-key: ${CLOUDFLARE_SECRET_ACCESS_KEY}
    bucket-name: ${R2_BUCKET}   # one bucket per environment

push:
  # FCM topic for workshop alerts. Only prod uses "workshops", the one the app subscribes to,
  # so dev and uat pushes never reach real users
  workshops-topic: ${WORKSHOPS_PUSH_TOPIC}

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true      # never send credentials or codes in clear text
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Sender of every email. With Amazon SES it must be a verified identity, e.g. "SWISRA <no-reply@example.com>"
mail:
  from: ${MAIL_FROM}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000           # access token: 1 hour; the app renews it with its refresh token
  refresh-expiration-days: 60   # a device unused for this long has to sign in again

# Only /actuator/health is exposed, and public (SecurityConfig), with no details, so it reveals nothing.
# /actuator/health checks the database too: the uptime monitor calls it, and it answers 503 when Supabase
# is down. /actuator/health/liveness only says the app runs: the Docker healthcheck uses it, so a
# database outage doesn't mark the container unhealthy.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true   # /health/liveness and /health/readiness, off by default outside Kubernetes
  health:
    mail:
      enabled: false    # an SMTP hiccup shouldn't report the API as down

server:
  port: 8080
  address: 0.0.0.0   # Binds to all network interfaces so local devices can reach it
  # Behind Caddy, the client IP comes from X-Forwarded-For (the rate limits count per IP). Only
  # Caddy can reach port 8080 (deploy/compose.yml), so clients can't fake the header.
  forward-headers-strategy: native

# Security/RateLimiter: per target (email or signed-in user) and per client IP. Over a limit, 429
# with Retry-After. The IP limits are looser because students share campus Wi-Fi.
rate-limit:
  login:          # POST /auth/login: password guessing
    target: { limit: 10, period: 15m }
    ip: { limit: 60, period: 15m }
  send-code:      # every endpoint that emails a code: flooding inboxes and the email quota
    target: { limit: 5, period: 1h }
    ip: { limit: 30, period: 1h }
  verify-code:    # every endpoint that checks a 6-digit code: guessing it
    target: { limit: 10, period: 15m }
    ip: { limit: 60, period: 15m }

preview:
  office-enabled: true                # false = don't start LibreOffice (tests); Office previews answer 503
  office-home: ${LIBREOFFICE_HOME:}   # LibreOffice install dir; empty = auto-detect
  port-numbers: 2002
  task-execution-timeout-ms: 60000

downloads:
  recent:
    default-limit: 10   # files returned by /users/{id}/recent-downloads when no ?limit is given
    max-limit: 50       # upper bound for ?limit

suggestions:
  attachments:
    max-size: 10MB      # per file, for suggestions and their replies
    allowed-extensions: pdf, png, jpg, jpeg, webp, gif, doc, docx, ppt, pptx, xls, xlsx, txt, csv
