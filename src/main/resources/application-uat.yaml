# Acceptance testing: the uat Supabase cloud project and the uat R2 bucket.
# Values come from .env.uat or the server's environment. The database has no defaults (see
# application.properties), so a missing variable stops startup.
spring:
  datasource:
    hikari:
      # Load tests (loadtest/RESULTS.md): with 5 connections requests queued from ~500 active
      # students; 12 kept p95 at 155 ms with 800. Keep it a few below the project's pooler Pool Size
      # (Supabase → Database → Settings), which caps client connections. DB_POOL_SIZE overrides it.
      maximum-pool-size: ${DB_POOL_SIZE:12}

cloudflare:
  r2:
    bucket-name: ${R2_BUCKET:uat}

push:
  workshops-topic: ${WORKSHOPS_PUSH_TOPIC:workshops-uat}
