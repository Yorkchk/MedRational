#spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_DATABASE}?user=postgres${SUPABASE_PROJECT_REF}&password=${SUPABASE_DB_PASSWORD}&sslmode=disable
#spring.datasource.driver-class-name=org.postgresql.Driver

# Clean JDBC URL without embedded user/password parameters
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:127.0.0.1}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_DATABASE:postgres}?sslmode=disable
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB