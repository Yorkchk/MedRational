spring.application.name=MedRational

# Supabase Database Connection via .env
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_DATABASE}?user=postgres.${SUPABASE_PROJECT_REF}&password=${SUPABASE_DB_PASSWORD}&sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB