spring.application.name=MedRational

# dev unless SPRING_PROFILES_ACTIVE (or --spring.profiles.active) says uat or prod.
# Each profile has its own application-{profile}.yaml and .env.{profile} file.
spring.profiles.default=dev

# Supabase cloud (uat, prod) through the Session pooler, which needs the user as
# postgres.<project-ref>. No defaults here, so uat and prod fail at startup instead of reaching
# another database; application-dev.yaml replaces this with the local Docker connection.
# The password sits in the URL, so it must be URL-encoded if it contains & # % / ? or spaces.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_DATABASE}?user=postgres.${SUPABASE_PROJECT_REF}&password=${SUPABASE_DB_PASSWORD}&sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
